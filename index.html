<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Lista de tareas</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Lista de Tareas</h1>
    <div id="accionesPrincipales">
        <input id="Item" placeholder="Nueva tarea...">

        <button id="Agregar">Agregar</button>
        <button id="Reset">Resetear</button>
    </div>

    <div id="Mensajes">
    </div>

    <ul id="Lista">

    </ul>
    <h3 id="Contador">Contador:</h3>
    
    <button id="TotalTareas">Total de tareas: <span id="TotalTareasCount"></span></button>
    <button id="TotalTareasPendientes">Pendientes: <span id="TotalTareasPendientesCount"></span></button>
    <button id="TotalTareasCompletadas">Completadas: <span id="TotalTareasCompletadasCount"></span></button>
    <script src="script.js"></script>
</body>    

</html>
